# Память Gradle. Можно переопределить в ~/.gradle/gradle.properties или ключом командной строки.
# После правки org.gradle.jvmargs обязателен ./gradlew --stop: демон живёт со старыми JVM-опциями.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment — имена параметров и javadoc поверх official Mojang mappings.
# 2024.11.17 — последний релиз ветки 1.21.1 на 2026-08-10; новых с ноября 2024 нет.
# Актуальность сверять: https://maven.parchmentmc.org/org/parchmentmc/data/parchment-1.21.1/maven-metadata.xml
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Версии окружения. Версия Minecraft обязана соответствовать версии NeoForge.
# Последнюю 21.1.x смотреть здесь:
# https://maven.neoforged.net/api/maven/latest/version/releases/net/neoforged/neoforge?filter=21.1.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
loader_version_range=[1,)

## Свойства мода

# Идентификатор мода. Только нижний регистр, регексп [a-z][a-z0-9_]{1,63}.
# Обязан совпадать с константой в классе, помеченном @Mod.
mod_id=murim
mod_name=Timo's Murim Ascension
mod_license=All Rights Reserved
mod_version=0.0.1
# Должен совпадать с базовым пакетом исходников.
mod_group_id=io.github.verycooltimo.murim

# GameTest: пространства имён, которые прогоняет runGameTestServer. БЕЗ пробелов вокруг знака равенства
# и внутри списка — пробел ломает загрузку тестов.
# Player Animation Library: репозиторий https://repo.redlance.org/public, лицензия MIT,
# modId player_animation_library. Проверено скачиванием артефакта 2026-08-10.
pal_version=1.1.5+mc.1.21.1

neoforge.enabledGameTestNamespaces=murim

