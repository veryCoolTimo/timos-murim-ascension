pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

// Плагин foojay-resolver-convention из шаблона MDK намеренно НЕ подключён.
//
// Он нужен, чтобы Gradle сам скачивал JDK под тулчейн. У нас эту задачу решает обёртка
// ./gw: она находит локальный JDK 21 и экспортирует JAVA_HOME, после чего Gradle берёт
// текущую JVM как кандидата тулчейна. Плагин при этом добавлял обязательный поход в сеть
// на этапе разбора settings.gradle — то есть сборка падала ещё до компиляции, если портал
// плагинов недоступен или не резолвится (поймано на macOS 2026-08-10).
//
// Следствие: JDK 21 должен быть установлен заранее. Если его нет, ./gw скажет об этом
// прямым текстом и подскажет команду установки — это понятнее, чем отказ резолва плагина.
